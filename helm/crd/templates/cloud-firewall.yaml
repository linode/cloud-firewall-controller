---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: cloudfirewalls.networking.linode.com
spec:
  group: networking.linode.com
  names:
    kind: CloudFirewall
    listKind: CloudFirewallList
    plural: cloudfirewalls
    singular: cloudfirewall
  scope: Namespaced
  versions:
  - name: alpha1v1
    schema:
      openAPIV3Schema:
        description: CloudFirewall is the Schema for the cloudfirewalls API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudFirewallSpec defines the desired state of CloudFirewall

              Importing replaces the firewall's whole ruleset, and the built-in defaults are
              written for standard LKE, so import mode requires an explicit decision about
              them, and defaultRules=false requires the rules the firewall needs. The
              controller enforces the same checks for CRDs that predate these rules.
            properties:
              defaultRules:
                description: |-
                  When true (the default when unset), the controller will automatically apply the
                  built-in default ruleset in addition to any user-specified rules in .spec.ruleset.
                  Set to false to opt-out and manage all rules yourself. Required when firewall-id
                  is set. There is deliberately no schema default: the controller treats unset as
                  true, and leaving it unset lets import mode tell "not decided" from "true".
                type: boolean
              firewall-id:
                description: |-
                  ID of an existing Cloud Firewall to manage instead of creating one. When set,
                  the controller only reconciles the firewall's rules (inbound, outbound and both
                  policies): it does not create the firewall, does not add or remove devices (the
                  firewall is expected to already be attached, e.g. via an LKE node pool's
                  firewall_id), and does not delete the firewall. A firewall attached to any
                  device outside this cluster is refused. Requires defaultRules to be set.
                  Removing this field releases the firewall untouched and the controller goes back
                  to creating its own.
                pattern: ^[0-9]+$
                type: string
              ruleset:
                properties:
                  inbound:
                    items:
                      properties:
                        action:
                          enum:
                          - ACCEPT
                          - DROP
                          type: string
                        addresses:
                          description: |-
                            The ruleset specs should be in sync with the structures defined in linodego:
                            https://github.com/linode/linodego/blob/main/firewall_rules.go

                            They are not directly imported in order to provide kubdebuilder with
                            parameter limitations for the CRD. At runtime this allows the Cluster API
                            to reject bad requests at the API rather than during reconciliation.
                          properties:
                            ipv4:
                              items:
                                pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2]?\d))?$
                                type: string
                              type: array
                            ipv6:
                              items:
                                pattern: (?i)(?<ipv6>(?:[\da-f]{0,4}:){1,7}(?:(?<ipv4>(?:(?:25[0-5]|2[0-4]\d|1?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|1?\d\d?))|[\da-f]{0,4}))(\/(0?\d{1,2}|1([0-1]\d|2[0-8])))?
                                type: string
                              type: array
                          type: object
                        description:
                          type: string
                        label:
                          type: string
                        ports:
                          pattern: ^((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})([,-]|$)){0,20}
                          type: string
                        protocol:
                          enum:
                          - TCP
                          - UDP
                          - ICMP
                          - IPENCAP
                          type: string
                      required:
                      - action
                      - addresses
                      - label
                      - protocol
                      type: object
                    type: array
                  inbound_policy:
                    default: DROP
                    enum:
                    - ACCEPT
                    - DROP
                    type: string
                  outbound:
                    items:
                      properties:
                        action:
                          enum:
                          - ACCEPT
                          - DROP
                          type: string
                        addresses:
                          description: |-
                            The ruleset specs should be in sync with the structures defined in linodego:
                            https://github.com/linode/linodego/blob/main/firewall_rules.go

                            They are not directly imported in order to provide kubdebuilder with
                            parameter limitations for the CRD. At runtime this allows the Cluster API
                            to reject bad requests at the API rather than during reconciliation.
                          properties:
                            ipv4:
                              items:
                                pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2]?\d))?$
                                type: string
                              type: array
                            ipv6:
                              items:
                                pattern: (?i)(?<ipv6>(?:[\da-f]{0,4}:){1,7}(?:(?<ipv4>(?:(?:25[0-5]|2[0-4]\d|1?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|1?\d\d?))|[\da-f]{0,4}))(\/(0?\d{1,2}|1([0-1]\d|2[0-8])))?
                                type: string
                              type: array
                          type: object
                        description:
                          type: string
                        label:
                          type: string
                        ports:
                          pattern: ^((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})([,-]|$)){0,20}
                          type: string
                        protocol:
                          enum:
                          - TCP
                          - UDP
                          - ICMP
                          - IPENCAP
                          type: string
                      required:
                      - action
                      - addresses
                      - label
                      - protocol
                      type: object
                    type: array
                  outbound_policy:
                    default: ACCEPT
                    enum:
                    - ACCEPT
                    - DROP
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: defaultRules must be set explicitly when firewall-id is set
              rule: '!has(self.firewall__dash__id) || has(self.defaultRules)'
            - message: with firewall-id set and defaultRules false, ruleset.inbound
                must list the rules the firewall needs
              rule: '!has(self.firewall__dash__id) || !has(self.defaultRules) || self.defaultRules
                || (has(self.ruleset) && has(self.ruleset.inbound) && size(self.ruleset.inbound)
                > 0)'
          status:
            description: CloudFirewallStatus defines the observed state of CloudFirewall
            properties:
              conditions:
                description: |-
                  Conditions report import-mode state: Imported (adopted, or why not) and
                  NodesProtected (whether every node is attached to an imported firewall).
                  Informational only; the controller never derives ownership from them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              firewall-id:
                type: string
              last-update:
                format: date-time
                type: string
              nodes:
                items:
                  type: integer
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
